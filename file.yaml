name: Build TV Home APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Generate Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/nexus/tvhome

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'NexusTVHome'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.nexus.tvhome'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.nexus.tvhome'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature
                  android:name="android.hardware.touchscreen"
                  android:required="false" />

              <uses-feature
                  android:name="android.software.leanback"
                  android:required="false" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="false"
                  android:enableOnBackInvokedCallback="false"
                  android:icon="@android:drawable/ic_menu_view"
                  android:label="NEXUS 电视桌面"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/nexus/tvhome/MainActivity.java <<'EOF'
          package com.nexus.tvhome;

          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.ResolveInfo;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.GridLayout;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.util.ArrayList;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Set;

          public class MainActivity extends Activity {
              private GridLayout grid;
              private int tileWidth;

              @Override
              public void onCreate(Bundle state) {
                  super.onCreate(state);
                  showDesktop();
              }

              @Override
              protected void onRestart() {
                  super.onRestart();
                  showDesktop();
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  showDesktop();
              }

              // 仅拦截本桌面的返回操作，不影响其他应用。
              @Override
              @SuppressWarnings("deprecation")
              public void onBackPressed() {
                  // 留在桌面。
              }

              private int dp(int value) {
                  return Math.round(
                      value * getResources().getDisplayMetrics().density
                  );
              }

              private void showDesktop() {
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(24), dp(20), dp(24), dp(20));
                  root.setBackgroundColor(Color.rgb(15, 23, 42));

                  TextView title = new TextView(this);
                  title.setText("NEXUS 电视桌面");
                  title.setTextSize(28);
                  title.setTextColor(Color.WHITE);
                  root.addView(title);

                  TextView tip = new TextView(this);
                  tip.setText("方向键选择 · 确认键打开 · 返回键停留");
                  tip.setTextSize(15);
                  tip.setTextColor(Color.LTGRAY);
                  tip.setPadding(0, dp(10), 0, dp(16));
                  root.addView(tip);

                  int widthDp = getResources()
                      .getConfiguration().screenWidthDp;
                  int columns = widthDp >= 700 ? 4 : 3;
                  tileWidth = dp(Math.max(
                      80, (widthDp - 48) / columns - 12
                  ));

                  grid = new GridLayout(this);
                  grid.setColumnCount(columns);

                  ScrollView scroll = new ScrollView(this);
                  scroll.addView(grid);
                  root.addView(scroll, new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      0,
                      1f
                  ));

                  Button first = addTile("设为默认桌面", () -> {
                      try {
                          startActivity(
                              new Intent(Settings.ACTION_HOME_SETTINGS)
                          );
                      } catch (Exception e) {
                          startActivity(
                              new Intent(Settings.ACTION_SETTINGS)
                          );
                      }
                  });

                  addTile("系统设置", () -> {
                      startActivity(
                          new Intent(Settings.ACTION_SETTINGS)
                      );
                  });

                  addTile("刷新应用", this::showDesktop);

                  List<ResolveInfo> apps = new ArrayList<>();
                  Set<String> packages = new HashSet<>();
                  packages.add(getPackageName());

                  // 优先采用电视入口，再补充普通安卓应用入口。
                  String[] categories = {
                      Intent.CATEGORY_LEANBACK_LAUNCHER,
                      Intent.CATEGORY_LAUNCHER
                  };

                  for (String category : categories) {
                      Intent query = new Intent(Intent.ACTION_MAIN);
                      query.addCategory(category);

                      for (ResolveInfo item :
                          getPackageManager()
                              .queryIntentActivities(query, 0)) {
                          if (packages.add(
                              item.activityInfo.packageName
                          )) {
                              apps.add(item);
                          }
                      }
                  }

                  apps.sort((a, b) ->
                      a.loadLabel(getPackageManager()).toString()
                          .compareToIgnoreCase(
                              b.loadLabel(
                                  getPackageManager()
                              ).toString()
                          )
                  );

                  for (ResolveInfo app : apps) {
                      String label = app.loadLabel(
                          getPackageManager()
                      ).toString();

                      addTile(label, () -> {
                          Intent launch =
                              new Intent(Intent.ACTION_MAIN);
                          launch.setClassName(
                              app.activityInfo.packageName,
                              app.activityInfo.name
                          );
                          launch.addFlags(
                              Intent.FLAG_ACTIVITY_NEW_TASK |
                              Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED
                          );
                          startActivity(launch);
                      });
                  }

                  setContentView(root);
                  first.requestFocus();
              }

              private Button addTile(String text, Runnable action) {
                  Button button = new Button(this);
                  button.setText(text);
                  button.setTextSize(16);
                  button.setTextColor(Color.WHITE);
                  button.setGravity(Gravity.CENTER);
                  button.setFocusable(true);
                  button.setMaxLines(2);
                  button.setBackgroundColor(
                      Color.rgb(51, 65, 85)
                  );

                  button.setOnFocusChangeListener((view, focused) -> {
                      view.setBackgroundColor(
                          focused
                              ? Color.rgb(37, 99, 235)
                              : Color.rgb(51, 65, 85)
                      );
                  });

                  button.setOnClickListener(view -> {
                      try {
                          action.run();
                      } catch (Exception e) {
                          Toast.makeText(
                              this,
                              "无法打开，请检查设备设置",
                              Toast.LENGTH_SHORT
                          ).show();
                      }
                  });

                  GridLayout.LayoutParams params =
                      new GridLayout.LayoutParams();
                  params.width = tileWidth;
                  params.height = dp(84);
                  params.setMargins(dp(6), dp(6), dp(6), dp(6));
                  grid.addView(button, params);

                  return button;
              }
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-TV-Home-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
